name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a PR supersedes its older run. Each run on main gets a group
# of its own, so none is cancelled or replaced while pending.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain and components rust-toolchain.toml pins.
      - name: Install toolchain
        run: rustup toolchain install
      # The settings window's font lookup links fontconfig at build time;
      # its Wayland libraries are loaded at run time and need nothing here.
      - name: Install fontconfig's headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The version scripts/gates.sh requires. rust-cache keeps the binary, so
      # this builds it only when the cache is cold.
      - name: Install cargo-deny
        # Outside the checkout, so no Cargo config a change adds can redirect it.
        working-directory: ${{ runner.temp }}
        run: cargo install --locked cargo-deny@0.20.2
      - name: Gates
        run: scripts/gates.sh
