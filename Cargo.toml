[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/tobylo/auto-clicker"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
# Backend modules opt out locally with `#[allow(unsafe_code)]` and a
# `// SAFETY:` comment on every block (AGENTS.md, "Hard rules").
unsafe_code = "deny"

[workspace.lints.clippy]
# Denied by `-D warnings` in the gates; tests are exempt through clippy.toml.
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# Unwinding runs drop guards, which release every pressed button and key.
panic = "unwind"
