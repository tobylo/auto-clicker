[package]
name = "auto-clicker-backend-portal"
description = "Portal input backend of auto-clicker: the RemoteDesktop portal and libei"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
auto-clicker-core = { path = "../core" }
# The only crate that touches the portals and libei. ashpd 0.13 rather than
# 0.14: the same RemoteDesktop and Registry calls on zbus 5, the version the
# tray's ksni is built on, so the daemon carries one zbus. `screencast` only
# because ashpd's `remote_desktop` does not build without it.
ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "remote_desktop", "screencast"] }
# libei's client side, pure Rust with no unsafe code.
reis = { version = "0.7.1", features = ["tokio"] }
# The device event stream; already in the tree through ksni and reis.
futures-util = { version = "0.3.34", default-features = false }
# `O_NONBLOCK` and `O_NOFOLLOW` for reading the token file.
libc = "0.2.191"
# The monotonic clock libei stamps frames with; already in the tree through reis.
rustix = { version = "1.0.7", default-features = false, features = ["std", "time"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "time", "sync", "macros", "net"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[lints]
workspace = true

[dev-dependencies]
auto-clicker-core = { path = "../core", features = ["fake"] }
fastrand = "2.5.0"
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "macros", "test-util"] }
