[package]
name = "auto-clicker-backend-kernel"
description = "Kernel input backend of auto-clicker: uinput virtual devices through evdev"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
auto-clicker-core = { path = "../core" }
# The only crate that touches /dev/uinput and evdev. `tokio`: the hotkey
# reader's event streams.
evdev = { version = "0.13.2", features = ["tokio"] }
# Watches /dev/input for keyboards coming and going. No default features: the
# reader waits on the descriptor through tokio itself.
inotify = { version = "0.11.5", default-features = false }
libc = "0.2.191"
tokio = { version = "1.54.1", default-features = false, features = ["net", "macros"] }

[lints]
workspace = true

[dev-dependencies]
fastrand = "2.5.0"
tokio = { version = "1.54.1", features = ["rt", "time", "signal", "macros", "sync"] }
