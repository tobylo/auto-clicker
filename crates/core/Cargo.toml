[package]
name = "auto-clicker-core"
description = "Core logic of auto-clicker: engine, recording format and config, without device access"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The recording fake input backend, for other crates' tests.
fake = []

[lints]
workspace = true

[dependencies]
fastrand = "2.5.0"
libc = "0.2.191"
# `renameat2(RENAME_NOREPLACE)` without `unsafe`, for saving recordings. Already
# in the tree through evdev, with the same feature.
nix = { version = "0.29.0", default-features = false, features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
# The recording file format (JSON, map D7).
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", default-features = false, features = ["time", "macros", "sync"] }
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "test-util", "sync", "macros", "time"] }
