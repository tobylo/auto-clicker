[package]
name = "auto-clicker-core"
description = "Core logic of auto-clicker: engine, recording format and config, without device access"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The recording fake input backend, for other crates' tests.
fake = []

[lints]
workspace = true

[dependencies]
fastrand = "2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
# The recording file format (JSON, map D7).
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", default-features = false, features = ["time", "macros", "sync"] }
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }

# The file calls only Linux has: `open` flags, and `renameat2(RENAME_NOREPLACE)`
# without `unsafe` for saving recordings. Windows uses std alone (fs/windows.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
# Already in the tree through evdev, with the same feature.
nix = { version = "0.29.0", default-features = false, features = ["fs"] }

[dev-dependencies]
# Reads README.md as GitHub renders it, for the project page's facts test
# (tests/facts). Already in the tree through Slint's markdown support.
pulldown-cmark = { version = "0.13.6", default-features = false }
tokio = { version = "1.54.1", features = ["rt", "test-util", "sync", "macros", "time"] }
