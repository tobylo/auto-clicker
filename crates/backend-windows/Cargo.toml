[package]
name = "auto-clicker-backend-windows"
description = "Windows backend of auto-clicker: every Win32 call the program makes"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

# Windows alone: on other systems the crate is empty (lib.rs).
[target.'cfg(windows)'.dependencies]
# The input interface output implements (WN04).
auto-clicker-core = { path = "../core" }
# The Win32 bindings (M5 brief decision 3): declarations only, no code of
# their own. Already in Cargo.lock through tokio and std's dependencies.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    # The message thread's window class (WNDCLASSW names a brush).
    "Win32_Graphics_Gdi",
    "Win32_Security",
    # The module handle a window class is registered for.
    "Win32_System_LibraryLoader",
    # The display turning off or on (RegisterPowerSettingNotification).
    "Win32_System_Power",
    # Session notices and the session's state (WTS).
    "Win32_System_RemoteDesktop",
    # GUID_SESSION_DISPLAY_STATUS.
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    # SendInput (WN04).
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# The deadlines a run's timer is handed (WN04); already in the tree through
# core.
tokio = { version = "1.54.1", default-features = false, features = ["time"] }

[lints]
workspace = true

[target.'cfg(windows)'.dev-dependencies]
# Runs over the fake output, to test the run timer (WN04).
auto-clicker-core = { path = "../core", features = ["fake"] }
fastrand = "2.5.0"
tokio = { version = "1.54.1", features = ["rt", "time", "macros"] }
