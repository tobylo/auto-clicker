[package]
name = "auto-clicker-settings"
description = "Settings window of auto-clicker, started by the daemon from its tray"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "auto-clicker-settings"
path = "src/main.rs"

[dependencies]
auto-clicker-core = { path = "../core" }
# The toolkit alone, on every system: the .slint files compile everywhere
# (build.rs). Royalty-free licence: the window shows AboutSlint.
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18"] }

# The window on Linux (src/linux/).
[target.'cfg(target_os = "linux")'.dependencies]
# Wayland through winit, drawn with femtovg on OpenGL; no tray, no software
# renderer, no X11.
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "backend-winit-wayland", "renderer-femtovg"] }
# Puts /dev/null on standard input once the socket is off it, without
# unsafe code; the portal backend already uses it.
rustix = { version = "1.0.7", default-features = false, features = ["std", "stdio"] }
# The overlay that picks the fixed point is full-screen on a chosen screen,
# which only winit can do: Slint's winit backend, pinned to Slint's own
# version, with only Wayland. Slint's `unstable-winit-030` reaches the same
# crate but builds in its X11 backend too. Slint, its build crate and this
# backend are pinned to one exact version, so an upgrade moves them together.
i-slint-backend-winit = { version = "=1.18.1", default-features = false, features = ["wayland", "renderer-femtovg"] }

# The window on Windows (src/windows/): Slint's winit backend alone, set as
# the platform by hand as on Linux, drawn by Slint's software renderer
# (softbuffer, GDI): femtovg's OpenGL drew nothing on the owner's PC's Intel
# graphics (WN10). The pipes, DPI awareness and the rest of Win32 are
# backend-windows'. The tests draw on the same renderer, with no display.
[target.'cfg(windows)'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "renderer-software"] }
i-slint-backend-winit = { version = "=1.18.1", default-features = false, features = ["renderer-software"] }
auto-clicker-backend-windows = { path = "../backend-windows" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Tests show the window on Slint's software renderer, with no display: the
# same crate, one feature more, and nothing new in Cargo.lock.
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "renderer-software"] }

[build-dependencies]
# Compiles the .slint files and bundles the translations into the binary.
slint-build = "=1.18.1"

[lints]
workspace = true
