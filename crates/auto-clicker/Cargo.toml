[package]
name = "auto-clicker"
description = "Auto clicker with macro record and playback for KDE Plasma on Wayland"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
auto-clicker-core = { path = "../core" }
auto-clicker-backend-kernel = { path = "../backend-kernel" }
auto-clicker-backend-portal = { path = "../backend-portal" }
auto-clicker-backend-kwin = { path = "../backend-kwin" }
auto-clicker-backend-wayland = { path = "../backend-wayland" }
auto-clicker-backend-hyprland = { path = "../backend-hyprland" }
fastrand = "2.5.0"
# The tray icon (StatusNotifierItem), on tokio.
ksni = { version = "0.3.7", default-features = false, features = ["tokio"] }
# `StreamExt` for logind's signal and property streams; already in the tree through ksni.
futures-util = { version = "0.3.34", default-features = false }
# `process` and `io-util`: the settings window, a program of its own on a
# socket pair.
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros", "signal", "sync", "time", "net", "process", "io-util"] }
# The single-instance bus name and logind's session state. Version 5 on
# purpose: ksni is built on it, so the tree carries one zbus.
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[lints]
workspace = true

[dev-dependencies]
auto-clicker-core = { path = "../core", features = ["fake"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time", "test-util", "io-util"] }
