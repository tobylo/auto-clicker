[package]
name = "auto-clicker-backend-wayland"
description = "Wayland backend of auto-clicker: the screen layout from xdg-output, and the on-screen display"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
auto-clicker-core = { path = "../core" }
# The Wayland connection, pure Rust: the daemon is built on its own, so no
# libwayland (W01 decision 7). Both already in the tree through the settings
# window's winit.
wayland-client = "0.31.15"
# `unstable`: xdg-output; `staging`: ext-image-copy-capture's cursor
# sessions, the pointer's position on niri (W02), and the fractional scale
# the on-screen display draws at (O01b).
wayland-protocols = { version = "0.32.13", features = ["client", "unstable", "staging"] }
# The on-screen display's layer-shell surfaces (O01 decision 9); already in
# Cargo.lock through the settings window's winit.
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
# SO_PEERCRED on the display's socket; already a dependency of the daemon.
libc = "0.2.191"
# The on-screen display's shared memory: an anonymous file from
# memfd_create, written without mmap or unsafe; already a dependency of the
# daemon through backend-kwin.
rustix = { version = "1.0.7", default-features = false, features = ["std", "fs"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "time", "sync"] }

[lints]
workspace = true

[dev-dependencies]
auto-clicker-core = { path = "../core", features = ["fake"] }
tokio = { version = "1.54.1", features = ["rt", "net", "time", "macros", "io-util"] }
