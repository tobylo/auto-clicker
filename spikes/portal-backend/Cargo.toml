[package]
name = "portal-backend-spike"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "X02 spike: RemoteDesktop + libei output, GlobalShortcuts and InputCapture on Plasma 6.8"

# Not a member of the repository's workspace: spikes are never built by it.
[workspace]

[dependencies]
# `screencast` too: ashpd 0.14.0's remote_desktop module does not build without it.
ashpd = { version = "0.14.0", default-features = false, features = ["tokio", "remote_desktop", "screencast", "global_shortcuts", "input_capture"] }
reis = { version = "0.7.1", features = ["tokio"] }
tokio = { version = "1", features = ["rt", "macros", "time", "signal"] }
futures-util = "0.3"
enumflags2 = "0.7"
rustix = { version = "1", features = ["time"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
